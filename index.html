<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AG Apps Portal</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --accent:#4f8cff;
    --accent-hover:#3b73e0;
    --text:#f2f3f5;
    --muted:#9aa0ab;
    --border:#262a33;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .container{
    max-width:960px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 0 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:24px;
  }
  header h1{
    font-size:20px;
    margin:0;
  }
  #userbox{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #userbox img{
    width:32px;height:32px;border-radius:50%;
  }
  #userbox button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
  }
  #userbox button:hover{border-color:var(--danger);color:var(--danger);}

  /* Login screen */
  #login-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:80vh;
    text-align:center;
  }
  #login-screen h2{font-size:26px;margin-bottom:8px;}
  #login-screen p{color:var(--muted);margin-bottom:28px;}
  .google-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    color:#1f1f1f;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  .google-btn:hover{background:#f2f2f2;}
  .google-btn svg{width:20px;height:20px;}

  /* App grid */
  #app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
    margin-top:8px;
  }
  .app-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .app-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
  }
  .app-icon{
    width:56px;height:56px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#8a5cff);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;color:#fff;
    margin-bottom:14px;
  }
  .app-card h3{margin:0 0 6px;font-size:17px;}
  .app-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;}

  /* Detail / download page */
  #detail-screen{display:none;}
  .back-btn{
    background:transparent;
    border:none;
    color:var(--accent);
    cursor:pointer;
    font-size:14px;
    margin-bottom:20px;
    padding:0;
  }
  .detail-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px;
    text-align:center;
  }
  .detail-icon{
    width:88px;height:88px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--accent),#8a5cff);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:34px;color:#fff;
    margin:0 auto 20px;
  }
  .detail-card h2{margin:0 0 8px;}
  .detail-card p.desc{color:var(--muted);margin-bottom:28px;line-height:1.5;}
  .download-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:14px 32px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
  }
  .download-btn:hover{background:var(--accent-hover);}
  .version-tag{
    display:inline-block;
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    background:#1f232c;
    padding:4px 10px;
    border-radius:20px;
  }

  /* Admin panel */
  #admin-panel{
    margin-top:40px;
    padding-top:24px;
    border-top:1px solid var(--border);
  }
  #admin-panel h3{
    font-size:15px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:16px;
  }
  .admin-form{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .admin-form input, .admin-form textarea{
    background:#0f1115;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .admin-form input[type="file"]{padding:8px 0;}
  .admin-form button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
  }
  .admin-form button:disabled{opacity:.5;cursor:not-allowed;}
  #upload-status{font-size:13px;color:var(--muted);min-height:18px;}
  .app-list-admin{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .app-row-admin{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);
    padding:10px 14px;border-radius:10px;font-size:14px;
  }
  .app-row-admin button{
    background:transparent;border:1px solid var(--danger);color:var(--danger);
    padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;
  }
  .hidden{display:none !important;}
  .loading-text{color:var(--muted);text-align:center;padding:40px 0;}
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2>AG Apps Portal</h2>
    <p>Sign in with your Google account to view and download apps.</p>
    <button class="google-btn" id="google-login-btn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.5 27 36 24 36c-5.3 0-9.7-3.2-11.3-7.9l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.8-5 6.4l6.6 5.4C39.9 37.4 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- MAIN APP (hidden until logged in) -->
  <div id="main-app" class="hidden">
    <header>
      <h1>AG Apps Portal</h1>
      <div id="userbox">
        <img id="user-photo" src="" alt="" />
        <span id="user-name"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <!-- APP LIST SCREEN -->
    <div id="list-screen">
      <div id="app-grid">
        <div class="loading-text">Loading apps...</div>
      </div>

      <!-- ADMIN PANEL: only shown to owner emails -->
      <div id="admin-panel" class="hidden">
        <h3>Owner Panel &mdash; Add New App</h3>
        <div class="admin-form">
          <input type="text" id="new-app-name" placeholder="App name (e.g. AG SageASI)" />
          <textarea id="new-app-desc" placeholder="Short description" rows="2"></textarea>
          <input type="text" id="new-app-version" placeholder="Version (e.g. 1.0.0)" />
          <label style="font-size:13px;color:var(--muted);">GitHub token (only needed while uploading — not saved anywhere)</label>
          <input type="password" id="gh-token" placeholder="Paste your GitHub token here" autocomplete="off" />
          <label style="font-size:13px;color:var(--muted);">APK file (max ~20MB)</label>
          <input type="file" id="new-app-file" accept=".apk" />
          <button id="add-app-btn">Add App</button>
          <div id="upload-status"></div>
        </div>

        <div class="app-list-admin" id="admin-app-list"></div>
      </div>
    </div>

    <!-- DETAIL / DOWNLOAD SCREEN -->
    <div id="detail-screen">
      <button class="back-btn" id="back-btn">&larr; Back to Apps</button>
      <div class="detail-card">
        <div class="detail-icon" id="detail-icon">A</div>
        <h2 id="detail-name">App Name</h2>
        <p class="desc" id="detail-desc">Description</p>
        <a href="#" id="detail-download-btn" class="download-btn" target="_blank" rel="noopener">
          ⬇ Download App
        </a>
        <div><span class="version-tag" id="detail-version">v1.0.0</span></div>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    orderBy,
    query,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBwgQquT7lrq2gt3npxnbeLZnvCn3EnwMk",
    authDomain: "ag-brand.firebaseapp.com",
    projectId: "ag-brand",
    storageBucket: "ag-brand.firebasestorage.app",
    messagingSenderId: "126188041089",
    appId: "1:126188041089:web:ad4e8e8fb067153fb76e80"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // ---- OWNER EMAILS: only these can add/delete apps ----
  const OWNER_EMAILS = ["agastin057@gmail.com", "aagastin89@gmail.com"];

  // ---- GitHub repo where APK files get stored ----
  const GITHUB_OWNER = "agastin177";
  const GITHUB_REPO = "ag-apps-portal";
  const GITHUB_BRANCH = "main";

  // ---- DOM refs ----
  const loginScreen = document.getElementById("login-screen");
  const mainApp = document.getElementById("main-app");
  const listScreen = document.getElementById("list-screen");
  const detailScreen = document.getElementById("detail-screen");
  const appGrid = document.getElementById("app-grid");
  const adminPanel = document.getElementById("admin-panel");
  const adminAppList = document.getElementById("admin-app-list");
  const userPhoto = document.getElementById("user-photo");
  const userName = document.getElementById("user-name");

  let currentUser = null;
  let appsCache = [];

  // ---- AUTH ----
  document.getElementById("google-login-btn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch(err => {
      alert("Login failed: " + err.message);
    });
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginScreen.classList.add("hidden");
      mainApp.classList.remove("hidden");
      userPhoto.src = user.photoURL || "";
      userName.textContent = user.displayName || user.email;

      if (OWNER_EMAILS.includes(user.email)) {
        adminPanel.classList.remove("hidden");
      } else {
        adminPanel.classList.add("hidden");
      }
      loadApps();
    } else {
      loginScreen.classList.remove("hidden");
      mainApp.classList.add("hidden");
    }
  });

  // ---- LOAD APPS ----
  async function loadApps() {
    appGrid.innerHTML = '<div class="loading-text">Loading apps...</div>';
    const q = query(collection(db, "apps"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    appsCache = [];
    snap.forEach(d => appsCache.push({ id: d.id, ...d.data() }));

    if (appsCache.length === 0) {
      appGrid.innerHTML = '<div class="loading-text">No apps added yet.</div>';
    } else {
      appGrid.innerHTML = "";
      appsCache.forEach(appData => {
        const card = document.createElement("div");
        card.className = "app-card";
        card.innerHTML = `
          <div class="app-icon">${(appData.name || "A").charAt(0).toUpperCase()}</div>
          <h3>${escapeHtml(appData.name)}</h3>
          <p>${escapeHtml(appData.description || "")}</p>
        `;
        card.addEventListener("click", () => showDetail(appData));
        appGrid.appendChild(card);
      });
    }

    renderAdminList();
  }

  function renderAdminList() {
    if (!currentUser || !OWNER_EMAILS.includes(currentUser.email)) return;
    adminAppList.innerHTML = "";
    appsCache.forEach(appData => {
      const row = document.createElement("div");
      row.className = "app-row-admin";
      row.innerHTML = `<span>${escapeHtml(appData.name)}</span>`;
      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deleteApp(appData));
      row.appendChild(delBtn);
      adminAppList.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  // ---- DETAIL / DOWNLOAD SCREEN ----
  function showDetail(appData) {
    listScreen.style.display = "none";
    detailScreen.style.display = "block";
    document.getElementById("detail-icon").textContent = (appData.name || "A").charAt(0).toUpperCase();
    document.getElementById("detail-name").textContent = appData.name;
    document.getElementById("detail-desc").textContent = appData.description || "";
    document.getElementById("detail-version").textContent = "v" + (appData.version || "1.0.0");
    document.getElementById("detail-download-btn").href = appData.apkUrl;
  }

  document.getElementById("back-btn").addEventListener("click", () => {
    detailScreen.style.display = "none";
    listScreen.style.display = "block";
  });

  // ---- ADD APP (owner only) ----
  document.getElementById("add-app-btn").addEventListener("click", async () => {
    if (!currentUser || !OWNER_EMAILS.includes(currentUser.email)) {
      alert("Only owner accounts can add apps.");
      return;
    }
    const name = document.getElementById("new-app-name").value.trim();
    const desc = document.getElementById("new-app-desc").value.trim();
    const version = document.getElementById("new-app-version").value.trim() || "1.0.0";
    const token = document.getElementById("gh-token").value.trim();
    const fileInput = document.getElementById("new-app-file");
    const file = fileInput.files[0];
    const status = document.getElementById("upload-status");
    const btn = document.getElementById("add-app-btn");

    if (!name || !file || !token) {
      alert("App name, GitHub token, and APK file are all required.");
      return;
    }

    const MAX_SIZE = 20 * 1024 * 1024; // 20MB safe limit for GitHub's API
    if (file.size > MAX_SIZE) {
      alert("File is too large for this upload method (limit ~20MB). Use the Cloud Shell manual-upload method for bigger APKs.");
      return;
    }

    btn.disabled = true;
    status.textContent = "Reading file...";

    try {
      const base64Content = await fileToBase64(file);
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-");
      const path = `apks/${Date.now()}_${safeName}`;

      status.textContent = "Uploading to GitHub...";
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,
        {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github+json"
          },
          body: JSON.stringify({
            message: `Add APK for ${name}`,
            content: base64Content,
            branch: GITHUB_BRANCH
          })
        }
      );

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `GitHub upload failed (${res.status})`);
      }

      const apkUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;

      status.textContent = "Saving app info...";
      await addDoc(collection(db, "apps"), {
        name,
        description: desc,
        version,
        apkUrl,
        createdAt: serverTimestamp(),
        addedBy: currentUser.email
      });

      status.textContent = "App added successfully!";
      document.getElementById("new-app-name").value = "";
      document.getElementById("new-app-desc").value = "";
      document.getElementById("new-app-version").value = "";
      document.getElementById("gh-token").value = "";
      fileInput.value = "";
      await loadApps();
      setTimeout(() => status.textContent = "", 3000);
    } catch (err) {
      status.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        const base64 = result.split(",")[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- DELETE APP (owner only) ----
  async function deleteApp(appData) {
    if (!confirm(`Delete "${appData.name}"? This cannot be undone.`)) return;
    try {
      await deleteDoc(doc(db, "apps", appData.id));
      await loadApps();
      // Note: this only removes the app from the list. The APK file itself
      // still sits in the /apks folder on hosting unless removed manually
      // via Cloud Shell and redeployed.
    } catch (err) {
      alert("Error deleting: " + err.message);
    }
  }
</script>

</body>
</html>
